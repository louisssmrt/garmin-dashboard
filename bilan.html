<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bilan de la semaine - Garmin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b14;
  --bg-glow:#0d1322;
  --card:#121826;
  --card-2:#171e2e;
  --border:#222b3f;
  --border-2:#2c3850;
  --text:#eef1f6;
  --muted:#9aa4b8;
  --dim:#646e85;
  --run:#11d989;
  --bike:#3d8bff;
  --swim:#16cfe6;
  --strength:#ffb023;
  --other:#a78bfa;
  --ok:#22d37a;
  --warn:#ffac38;
  --danger:#ff4d57;
  --display:'Space Grotesk',-apple-system,system-ui,sans-serif;
  --body:'Plus Jakarta Sans',-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  background:
    radial-gradient(1200px 600px at 75% -5%, var(--bg-glow), transparent 60%),
    radial-gradient(900px 500px at 10% 8%, #0c1426, transparent 55%),
    var(--bg);
  color:var(--text);font-family:var(--body);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.wrap{max-width:1080px;margin:0 auto;padding:34px 24px 90px}

/* ---- top bar ---- */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:38px;flex-wrap:wrap;gap:12px}
.topbar .kick{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.topbar .period{font-family:var(--display);font-size:13px;font-weight:600;color:var(--text)}
.topbar .dash-link{font-size:12.5px;color:var(--dim);text-decoration:none;border:1px solid var(--border);padding:6px 12px;border-radius:99px;transition:.2s}
.topbar .dash-link:hover{border-color:var(--border-2);color:var(--muted)}

/* ---- hero verdict ---- */
.hero{margin-bottom:44px}
.hero .emoji{font-size:46px;line-height:1;margin-bottom:18px}
.hero h1{
  font-family:var(--display);font-weight:700;
  font-size:clamp(34px,6vw,62px);line-height:1.02;letter-spacing:-.025em;
  max-width:16ch;
}
.hero .sub{margin-top:18px;font-size:clamp(16px,2.2vw,20px);color:var(--muted);max-width:46ch;line-height:1.5}

/* ---- big number band ---- */
.band{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);
  border:1px solid var(--border);border-radius:18px;overflow:hidden;margin-bottom:44px}
.band .cell{background:var(--card);padding:22px 22px 20px}
.band .cell .n{font-family:var(--display);font-weight:700;font-size:clamp(26px,4vw,40px);
  line-height:1;letter-spacing:-.03em}
.band .cell .n small{font-size:.42em;color:var(--muted);font-weight:600;margin-left:4px;letter-spacing:0}
.band .cell .l{margin-top:9px;font-size:11.5px;color:var(--dim);text-transform:uppercase;
  letter-spacing:.11em;font-weight:600}
@media(max-width:720px){.band{grid-template-columns:repeat(2,1fr)}}

/* ---- section heading ---- */
.sec{font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:-.01em;
  margin:0 0 18px;display:flex;align-items:baseline;gap:12px}
.sec .meta{font-family:var(--body);font-size:12.5px;color:var(--dim);font-weight:500;letter-spacing:0}
.block{margin-bottom:48px}

/* ---- plan tracker ---- */
.plan{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:74px 1fr;gap:16px;background:var(--card);
  border:1px solid var(--border);border-radius:14px;padding:15px 18px;position:relative;overflow:hidden}
.row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.row.ok::before{background:var(--ok)}
.row.partial::before{background:var(--warn)}
.row.miss::before{background:var(--danger)}
.row .day{font-family:var(--display);font-weight:600;font-size:14px;color:var(--text);padding-top:1px}
.row .body .planned{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;
  font-weight:600;margin-bottom:5px}
.row .body .done{font-size:14.5px;color:var(--text);font-weight:500}
.row .body .note{font-size:13px;color:var(--muted);margin-top:5px}
.row .tag{position:absolute;top:14px;right:16px;font-size:10.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:99px}
.row.ok .tag{background:rgba(34,211,122,.14);color:var(--ok)}
.row.partial .tag{background:rgba(255,172,56,.14);color:var(--warn)}
.row.miss .tag{background:rgba(255,77,87,.14);color:var(--danger)}
.plan-sum{margin-top:16px;font-size:14px;color:var(--muted);line-height:1.55;
  padding-left:15px;border-left:2px solid var(--border-2)}

/* ---- discipline chips ---- */
.disc{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:720px){.disc{grid-template-columns:repeat(2,1fr)}}
.chip{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 16px 14px;
  position:relative}
.chip .dot{width:9px;height:9px;border-radius:99px;display:inline-block;margin-right:7px;vertical-align:middle}
.chip .name{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.chip .big{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.02em;margin-top:10px;line-height:1}
.chip .meta{font-size:12.5px;color:var(--dim);margin-top:6px}
.chip.zero .big{color:var(--danger)}
.dot.run{background:var(--run)}.dot.bike{background:var(--bike)}
.dot.swim{background:var(--swim)}.dot.strength{background:var(--strength)}.dot.other{background:var(--other)}

/* ---- recovery gauges ---- */
.gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:720px){.gauges{grid-template-columns:repeat(2,1fr)}}
.gauge{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 16px 18px}
.gauge .label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.gauge .val{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:-.03em;margin-top:8px;line-height:1}
.gauge .val small{font-size:.45em;color:var(--muted);font-weight:600;margin-left:2px}
.gauge .delta{font-size:12.5px;margin-top:7px;font-weight:600}
.gauge .delta.up{color:var(--ok)}.gauge .delta.down{color:var(--danger)}.gauge .delta.flat{color:var(--dim)}
.gauge .avg7{font-size:11.5px;color:var(--dim);margin-top:6px;font-weight:500}
.gauge .track{margin-top:12px;height:5px;background:var(--border);border-radius:99px;overflow:hidden}
.gauge .track span{display:block;height:100%;border-radius:99px}

/* ---- highlights ---- */
.highlights{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:820px){.highlights{grid-template-columns:1fr}}
.hl{background:linear-gradient(160deg,var(--card-2),var(--card));border:1px solid var(--border);
  border-radius:16px;padding:20px}
.hl .t{font-family:var(--display);font-weight:600;font-size:16px;margin-bottom:9px}
.hl .p{font-size:14px;color:var(--muted);line-height:1.55}

/* ---- run pace list ---- */
.paces{display:flex;flex-direction:column;gap:8px}
.pace-row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:12px 16px}
.pace-row .d{font-family:var(--display);font-size:13px;color:var(--dim);width:58px;font-weight:600}
.pace-row .km{font-size:14px;color:var(--muted);width:74px}
.pace-row .pc{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.02em;flex:1}
.pace-row .hr{font-size:13px;color:var(--dim)}

/* ---- to remember + risk ---- */
.callout{background:linear-gradient(150deg,rgba(17,217,137,.06),var(--card));
  border:1px solid var(--border-2);border-radius:18px;padding:24px 26px;margin-bottom:14px}
.callout .h{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--run);margin-bottom:10px}
.callout p{font-size:15.5px;line-height:1.6;color:var(--text)}
.risk{border-radius:14px;padding:18px 22px;display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.risk.ok{background:rgba(34,211,122,.07);border:1px solid rgba(34,211,122,.25)}
.risk.warn{background:rgba(255,172,56,.07);border:1px solid rgba(255,172,56,.25)}
.risk.danger{background:rgba(255,77,87,.08);border:1px solid rgba(255,77,87,.3)}
.risk .ic{font-size:22px;line-height:1.3}
.risk .h{font-family:var(--display);font-weight:600;font-size:14px;margin-bottom:4px}
.risk.ok .h{color:var(--ok)}.risk.warn .h{color:var(--warn)}.risk.danger .h{color:var(--danger)}
.risk p{font-size:14px;color:var(--muted);line-height:1.55}

.next{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 24px}
.next .h{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.next p{font-size:15px;line-height:1.6;color:var(--text)}

footer{margin-top:50px;text-align:center;font-size:12px;color:var(--dim)}

/* entry animation */
.block,.hero,.band{animation:rise .6s cubic-bezier(.2,.7,.3,1) both}
.band{animation-delay:.05s}.block:nth-of-type(1){animation-delay:.1s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <span class="kick">Bilan de la semaine</span>
    <span class="period" id="period"></span>
    <a class="dash-link" href="index.html">Dashboard complet →</a>
  </div>

  <div class="hero">
    <div class="emoji" id="verdict-emoji"></div>
    <h1 id="verdict-title"></h1>
    <p class="sub" id="verdict-sub"></p>
  </div>

  <div class="band" id="band"></div>

  <div class="block">
    <h2 class="sec">Suivi du plan <span class="meta" id="plan-meta"></span></h2>
    <div class="plan" id="plan"></div>
    <p class="plan-sum" id="plan-sum"></p>
  </div>

  <div class="block">
    <h2 class="sec">Volume par discipline</h2>
    <div class="disc" id="disc"></div>
  </div>

  <div class="block">
    <h2 class="sec">Récupération <span class="meta" id="gauges-meta"></span></h2>
    <div class="gauges" id="gauges"></div>
  </div>

  <div class="block">
    <h2 class="sec">Ce qui a marqué la semaine</h2>
    <div class="highlights" id="highlights"></div>
  </div>

  <div class="block" id="paces-block">
    <h2 class="sec">Allures course</h2>
    <div class="paces" id="paces"></div>
  </div>

  <div class="block">
    <h2 class="sec">À retenir</h2>
    <div class="callout"><div class="h">Le verdict</div><p id="to-remember"></p></div>
    <div class="risk" id="risk"></div>
    <div class="next"><div class="h">La semaine qui vient</div><p id="next-week"></p></div>
  </div>

  <footer id="footer"></footer>
</div>

<script>
const COLORS={run:'#11d989',bike:'#3d8bff',swim:'#16cfe6',strength:'#ffb023',other:'#a78bfa'};
const fr=(s)=>s||'';

function deltaHtml(cur,prev,betterLow=false,unit='',label=' vs S-1'){
  if(cur==null||prev==null) return '<div class="delta flat">—</div>';
  const d=Math.round((cur-prev)*10)/10;
  if(Math.abs(d)<0.05) return `<div class="delta flat">stable${label}</div>`;
  const better = betterLow ? d<0 : d>0;
  const arrow = d>0?'▲':'▼';
  return `<div class="delta ${better?'up':'down'}">${arrow} ${d>0?'+':''}${d}${unit}${label}</div>`;
}

fetch('bilan-data.json?'+Date.now()).then(r=>r.json()).then(d=>{
  const n=d.narrative;

  document.getElementById('period').textContent=d.period.label;
  document.getElementById('verdict-emoji').textContent=n.verdict_emoji;
  document.getElementById('verdict-title').textContent=n.verdict_title;
  document.getElementById('verdict-sub').textContent=n.verdict_sub;

  // band
  const off=d.off_days.length;
  document.getElementById('band').innerHTML=[
    {n:d.totals.dur_hours,s:'h',l:'Volume total'},
    {n:d.totals.sessions,s:'',l:'Séances'},
    {n:d.totals.load,s:'',l:'Charge cumulée'},
    {n:off,s:'',l:off<=1?'Jour OFF':'Jours OFF'},
  ].map(c=>`<div class="cell"><div class="n">${c.n}<small>${c.s}</small></div><div class="l">${c.l}</div></div>`).join('');

  // plan
  document.getElementById('plan-meta').textContent=`${n.plan_rows.length} jours suivis`;
  document.getElementById('plan').innerHTML=n.plan_rows.map(r=>{
    const cls=r.status==='ok'?'ok':r.status==='partial'?'partial':'miss';
    const tag=r.status==='ok'?'Tenue':r.status==='partial'?'Partielle':'Manquée';
    return `<div class="row ${cls}">
      <div class="day">${r.day}</div>
      <div class="body">
        <div class="planned">${fr(r.planned)}</div>
        <div class="done">${fr(r.done)}</div>
        ${r.note?`<div class="note">${r.note}</div>`:''}
      </div>
      <span class="tag">${tag}</span>
    </div>`;
  }).join('');
  document.getElementById('plan-sum').textContent=n.plan_summary;

  // disciplines
  document.getElementById('disc').innerHTML=d.disciplines.map(e=>{
    const zero=e.count===0;
    const metric = e.color==='strength'
      ? (e.count?e.dur:'aucune')
      : (e.dist_km?`${e.dist_km} km`:(e.dur!=='-'?e.dur:'—'));
    return `<div class="chip ${zero?'zero':''}">
      <div class="name"><span class="dot ${e.color}"></span>${e.name}</div>
      <div class="big">${zero?'0':metric}</div>
      <div class="meta">${e.count} séance${e.count>1?'s':''}${e.count&&e.color!=='strength'?` · ${e.dur}`:''}${e.load?` · charge ${e.load}`:''}</div>
    </div>`;
  }).join('');

  // gauges — valeur du DERNIER jour en gros, moyenne 7j en dessous, delta = jour vs moy 7j
  const m=d.metrics,l=d.metrics_last||{};
  const pctRhr=(v)=>v?Math.max(0,100-(v-38)*4):0;
  const pctStress=(v)=>v?Math.max(0,100-v*1.6):0;
  const g=[
    {label:'Readiness',today:l.readiness,avg:m.readiness,sm:'/100',low:false,pct:l.readiness,color:'--run'},
    {label:'FC repos',today:l.resting_hr,avg:m.resting_hr,sm:'bpm',low:true,pct:pctRhr(l.resting_hr),color:'--swim'},
    {label:'Sommeil',today:l.sleep_score,avg:m.sleep_score,sm:'/100',low:false,pct:l.sleep_score,color:'--bike'},
    {label:'Stress',today:l.stress,avg:m.stress,sm:'/100',low:true,pct:pctStress(l.stress),color:'--strength'},
  ];
  document.getElementById('gauges').innerHTML=g.map(x=>{
    const col=getComputedStyle(document.documentElement).getPropertyValue(x.color);
    return `<div class="gauge">
      <div class="label">${x.label}</div>
      <div class="val">${x.today??'—'}<small>${x.sm}</small></div>
      ${deltaHtml(x.today,x.avg,x.low,'',' vs moy 7j')}
      <div class="avg7">moy 7j : ${x.avg??'—'}${x.sm==='bpm'?' bpm':''}</div>
      <div class="track"><span style="width:${Math.min(100,Math.max(4,x.pct||4))}%;background:${col}"></span></div>
    </div>`;
  }).join('');

  // meta du titre récup = date du dernier jour dispo
  const ld=l.date;
  const frDay = ld ? `${ld.slice(8,10)}/${ld.slice(5,7)}` : '';
  document.getElementById('gauges-meta').textContent = ld ? `état du ${frDay} · moyenne 7j en dessous` : 'moyenne 7j';

  // highlights
  document.getElementById('highlights').innerHTML=n.highlights.map(h=>
    `<div class="hl"><div class="t">${h.title}</div><div class="p">${h.punch}</div></div>`).join('');

  // paces
  if(d.run_sessions.length){
    document.getElementById('paces').innerHTML=d.run_sessions.map(s=>
      `<div class="pace-row">
        <span class="d">${s.date.slice(8,10)}/${s.date.slice(5,7)}</span>
        <span class="km">${s.dist_km} km</span>
        <span class="pc">${s.pace||'—'}</span>
        <span class="hr">${s.hr?'FC '+s.hr:''}</span>
      </div>`).join('');
  } else { document.getElementById('paces-block').style.display='none'; }

  // remember + risk + next
  document.getElementById('to-remember').textContent=n.to_remember;
  const riskMap={ok:['🟢','Aucun risque'],warn:['🟡','Vigilance'],danger:['🔴','Risque']};
  const rk=riskMap[n.risk_level]||riskMap.ok;
  const risk=document.getElementById('risk');
  risk.className='risk '+n.risk_level;
  risk.innerHTML=`<span class="ic">${rk[0]}</span><div><div class="h">${rk[1]}</div><p>${n.risk_text}</p></div>`;
  document.getElementById('next-week').textContent=n.next_week;

  document.getElementById('footer').textContent=`Données Garmin → Supabase · généré le ${d.generated_at}`;
});
</script>
</body>
</html>
